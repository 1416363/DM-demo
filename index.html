<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealer Mobility. Возможности приложения</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Google+Sans:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Сцена 1920×1080 масштабируется по ширине; справа от неё — список разделов; один общий фон */

/* Кадр 1920×1080: телефон слева, подписи справа */
 #dm-root{--accent:#0e7c86;--ink:#1c1c1e;--text:#3a3a3c;--grey:#8e8e93;--line:#e6e6ea;--feed:#f0f0f2;--stage:#ffffff;
 --ui:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;--display:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
 --cap-head:'Unbounded','Google Sans',Arial,sans-serif;--cap-text:'Google Sans',Arial,sans-serif}
#dm-root,#dm-root *{box-sizing:border-box}
#dm-root{background:var(--stage);color:var(--ink);font-family:var(--cap-text)}
.stage{position:absolute;inset:0;background:radial-gradient(1200px 800px at 30% 50%,#f6f9f9 0%,var(--stage) 70%)}
.phone-wrap{position:absolute;left:330px;top:50%;width:390px;height:844px;transform:translateY(-50%) scale(1.13);transform-origin:center}
.phone{position:absolute;inset:0;border-radius:52px;overflow:hidden;background:#fff;box-shadow:0 0 0 11px #111,0 30px 70px rgba(0,40,45,.28);color:var(--ink)}
.status{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 44px;font:600 17px var(--ui);background:#fff;z-index:50}
.status .r{display:flex;align-items:center;gap:6px;font:600 15px var(--ui)}
.bars{display:flex;align-items:flex-end;gap:2px;height:12px}.bars i{width:3px;background:currentColor;border-radius:1px}
.batt{background:var(--ink);color:#fff;font:700 12px var(--ui);border-radius:4px;padding:1px 4px}
.vp{position:absolute;left:0;right:0;top:54px;bottom:0;overflow:hidden}
.scr{position:absolute;inset:0;background:#fff;overflow:hidden;transform:translateX(100%)}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#111;z-index:90}
.press{position:absolute;inset:0;background:rgba(0,0,0,.07);opacity:0;pointer-events:none}
.pos{position:relative}
/* шапка главного экрана и вкладки */
.top{height:56px;display:grid;grid-template-columns:70px 1fr 90px;align-items:center;padding:0 12px;background:#fff;position:relative;z-index:2}
.top img{width:52px}.top .t{text-align:center;font:600 20px var(--ui)}
.top .ic{position:relative;height:26px}
.top .ic>div{position:absolute;right:0;top:0;display:flex;gap:16px;color:var(--accent)}
.top svg{width:26px;height:26px}
.tabs{display:flex;border-bottom:1px solid var(--line);height:44px;background:#fff;position:relative;z-index:2}
.tabs div{flex:1;text-align:center;font:400 15.5px/42px var(--ui);color:var(--text);position:relative}
.uline{position:absolute;left:0;bottom:-1px;height:3px;width:97.5px;background:var(--accent)}
.panels{position:absolute;left:0;right:0;top:100px;bottom:0;overflow:hidden}
.panel{position:absolute;inset:0;overflow:hidden;background:#fff}
/* лента */
.feedp{background:var(--feed)}
.feed{padding-top:8px;display:flex;flex-direction:column;gap:8px}
.card{background:#fff;padding:16px 16px 14px;position:relative}
.meta{display:flex;align-items:center;gap:12px}
.badge{background:var(--accent);color:#fff;font:500 13px var(--ui);padding:3px 7px;border-radius:3px;white-space:nowrap}
.term{display:flex;align-items:center;gap:5px;color:var(--accent);font:400 13.5px var(--ui)}
.h{font:600 18px/1.3 var(--ui);margin-top:10px;color:var(--text)}
.date{font:400 15px var(--ui);color:var(--text);margin-top:10px}
.wide{width:calc(100% + 32px);margin:12px -16px 0;display:block}
/* список услуг */
.svc{border-top:8px solid var(--feed)}
.srow{display:flex;align-items:center;gap:22px;height:56px;padding:0 20px;font:400 17px var(--ui);color:var(--ink);position:relative}
.srow svg{width:26px;height:26px;color:var(--accent);flex:none}
/* кнопка консультанта */
.fab{position:absolute;right:16px;bottom:50px;height:56px;padding:0 22px 0 18px;display:flex;align-items:center;gap:9px;border-radius:28px;color:#fff;font:600 17px/1 var(--ui);z-index:40;
 background:linear-gradient(180deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 60%,rgba(20,0,90,.14) 100%),linear-gradient(115deg,#2b7cff 0%,#6a4dff 50%,#b83cff 100%);
 text-shadow:0 1px 2px rgba(30,0,90,.35);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -4px 8px rgba(40,10,130,.45),0 10px 22px rgba(80,50,220,.5),0 3px 6px rgba(0,0,0,.3)}
.fab svg{width:24px;height:24px}
/* навигационная шапка экранов */
.nav{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:20px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);z-index:3;color:var(--accent)}
.nav svg{width:24px;height:24px;flex:none}
.nav .tt{flex:1;min-width:0;font:600 18px var(--ui);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .tt small{display:block;font:400 11.5px var(--ui);color:var(--grey);margin-top:1px}
.nav .rt{position:relative;width:24px;height:24px}
.nav .rt>span{position:absolute;inset:0}
.ok-off{color:#c9c9ce}
.body{position:absolute;left:0;right:0;top:56px;bottom:0;overflow:hidden}
.art{position:relative}
.art>img{width:100%;display:block}
.art .in{padding:14px 16px 0}
.art h2{font:700 21px/1.25 var(--ui);margin:10px 0 4px;color:var(--ink)}
.art .d{font:400 14px var(--ui);color:var(--grey)}
.art p{font:400 15.5px/1.42 var(--ui);color:var(--text);margin:14px 0 0}
.art .sec{font:700 15.5px var(--ui);color:var(--ink);margin-top:20px}
.art .it{margin-top:12px;font:400 15px/1.4 var(--ui);color:var(--text)}
.art .it b{color:var(--ink)}
.art .pr{margin-top:6px;font:400 15px var(--ui);color:var(--text)}
.art .note{font-style:italic}
.art .lnk{color:#1a5fd0;text-decoration:underline}
.art .fine{font:400 9.5px/1.5 var(--ui);color:#666;margin-top:12px}
.rows{margin-top:22px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:16px;height:54px;padding:0 16px;border-bottom:1px solid var(--line);font:400 16.5px var(--ui);color:var(--accent);position:relative}
.row svg{width:24px;height:24px;flex:none}
.grp{background:var(--feed);padding:18px 16px 8px;font:500 13px var(--ui);color:var(--grey);letter-spacing:.04em}
.mini{display:flex;gap:12px;background:#fff;padding:12px 16px;border-bottom:1px solid var(--line);position:relative}
.mini img{width:96px;height:64px;object-fit:cover;flex:none;border-radius:2px}
.mini .h{margin-top:6px;font-size:15px}
.mini .dt{font:400 13px var(--ui);color:var(--grey);margin-top:6px}
/* формы */
.frow{display:flex;align-items:center;gap:22px;min-height:56px;padding:0 18px;border-bottom:1px solid var(--line);font:400 16.5px var(--ui);color:var(--ink);position:relative}
.frow svg{width:24px;height:24px;color:#8e8e93;flex:none}
.frow .car{width:44px;height:36px;object-fit:contain;flex:none;margin-left:-6px}
.frow .two{font:400 16.5px var(--ui)}.frow .two small{display:block;font:400 14px var(--ui);color:var(--grey);margin-top:2px}
.ph{color:#9a9aa0}.req{color:#d33}
.val{position:absolute;left:64px;top:50%;transform:translateY(-50%);opacity:0;background:#fff;padding-right:20px}
.fhead{padding:16px 18px 8px;font:600 16px var(--ui);color:var(--ink)}
.radio{display:flex;align-items:center;gap:22px;height:52px;padding:0 22px;font:400 16.5px var(--ui);position:relative}
.rb{width:22px;height:22px;border-radius:50%;border:2px solid #b8b8be;position:relative;flex:none}
.rb i{position:absolute;inset:3px;border-radius:50%;background:var(--accent);opacity:0}
.hint{font:400 12.5px/1.35 var(--ui);color:var(--grey);padding:6px 18px 14px}
.field{margin:18px 18px 0;padding-bottom:8px;border-bottom:1px solid #c9c9ce;font:400 16.5px var(--ui);color:#9a9aa0}
/* календарь */
.cal{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.cal .m{font:400 16px var(--ui);color:var(--ink)}
.wk{display:grid;grid-template-columns:repeat(8,1fr);text-align:center;margin-top:16px;font:400 12px var(--ui);color:var(--grey)}
.dd{display:grid;grid-template-columns:repeat(8,1fr);text-align:center;margin-top:12px;font:400 16px var(--ui)}
.dd div{position:relative;height:38px;line-height:38px}
.sel{position:absolute;left:50%;top:0;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--accent);opacity:0}
.dd span{position:relative;z-index:1}
.wt{position:absolute;left:0;right:0;top:0;text-align:center;line-height:38px;color:#fff;opacity:0;z-index:2}
.calbody{position:absolute;left:0;right:0;top:170px;bottom:0;background:var(--feed)}
.nofree{position:absolute;left:0;right:0;top:120px;text-align:center;font:400 14px var(--ui);color:var(--grey)}
.nofree svg{width:34px;height:34px;color:#9a9aa0;display:block;margin:0 auto 10px}
.slots{position:absolute;left:0;right:0;top:20px;display:grid;grid-template-columns:repeat(3,96px);gap:14px 18px;justify-content:center;opacity:0}
.slot{height:36px;border:1.5px solid var(--accent);border-radius:3px;text-align:center;line-height:33px;font:400 15px var(--ui);color:var(--accent);background:#fff;position:relative}
.slot .on{position:absolute;inset:-1.5px;border-radius:3px;background:var(--accent);color:#fff;opacity:0}
/* списки выбора */
.opt{padding:12px 18px;border-bottom:1px solid #f0f0f2;position:relative}
.opt b{display:block;font:400 16.5px var(--ui);color:var(--ink)}
.opt small{display:block;font:400 12.5px var(--ui);color:var(--grey);margin-top:2px}
/* марки и автомобили */
.brands{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.brands div{height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
.brands img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.carc{border-bottom:8px solid var(--feed);position:relative}
.carc img{width:100%;display:block}
.carc .n{font:400 16px var(--ui);padding:6px 16px 0}.carc .s{font:400 14px var(--ui);color:var(--grey);padding:2px 16px 12px}
.avail{background:#9a9ba0;color:#fff;font:400 12.5px var(--ui);padding:7px 16px}
.cname{font:400 21px var(--ui);padding:14px 16px 4px}.cdash{color:var(--grey);padding:0 16px 16px;border-bottom:1px solid var(--line)}
.more{background:var(--feed);padding:16px 16px 10px;font:500 13.5px var(--ui);color:#6b6b70;letter-spacing:.03em;border-bottom:1px solid var(--line)}
.bbtn{position:absolute;left:0;right:0;bottom:34px;height:52px;background:var(--accent);color:#fff;font:600 15px var(--ui);letter-spacing:.03em;display:grid;place-items:center;z-index:2}
.bbtn .press{background:rgba(255,255,255,.18)}
/* поиск и клавиатура */
.sbar{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:20px;padding:0 16px;border-bottom:1px solid var(--line);background:#fff;z-index:3;color:var(--accent)}
.sbar svg{width:24px;height:24px;flex:none}
.sfield{flex:1;font:400 18px var(--ui);color:var(--ink);position:relative;height:26px}
.sfield .phd{position:absolute;left:0;top:0;color:#9a9aa0}
.sfield .typed{position:absolute;left:0;top:0;text-decoration:underline;text-underline-offset:3px}
.sfield .typed span{opacity:0}
.sclear{opacity:0}
.kb{position:absolute;left:0;right:0;bottom:0;height:290px;background:#d3d6dc;padding:6px 3px 0;z-index:4}
.sugg{display:flex;height:40px;align-items:center;justify-content:space-around;font:400 17px var(--ui);color:var(--ink);opacity:0}
.krow{display:flex;justify-content:center;gap:6px;margin-top:10px}
.k{width:33px;height:42px;border-radius:5px;background:#fff;box-shadow:0 1px 0 #8a8d93;display:grid;place-items:center;font:400 21px var(--ui);color:var(--ink);position:relative}
.k.w{width:46px;background:#adb2bb;font-size:14px}.k.sp{width:170px;font-size:14px;color:#555}.k.go{width:80px;background:var(--accent);color:#fff;font-size:15px}
.k .hl{position:absolute;inset:0;border-radius:5px;background:#9aa0a8;opacity:0}
.res{position:absolute;left:0;right:0;top:56px;bottom:0;background:#fff;opacity:0}
.empty{position:absolute;left:0;right:0;top:170px;text-align:center;font:400 16px var(--ui);color:var(--grey)}
.empty svg{width:40px;height:40px;display:block;margin:0 auto 12px;color:#9a9aa0}
.hit{color:#1a5fd0}
.emp{display:flex;align-items:center;gap:14px;padding:12px 16px;font:400 16px var(--ui)}
.emp .av{width:40px;height:40px;border-radius:50%;background:#e4e4e8;display:grid;place-items:center;color:#a0a0a6}.emp .av svg{width:24px;height:24px}
.grph{display:flex;justify-content:space-between}
.grph b{color:var(--accent);font-weight:600}
/* экран блокировки */
.lock{position:absolute;inset:0;z-index:80;opacity:0;color:#fff;
 background:radial-gradient(120% 80% at 20% 0%,#2c3f8f 0%,rgba(44,63,143,0) 55%),linear-gradient(170deg,#3a4fa8 0%,#c52a4e 48%,#ee3b3b 62%,#3b8fd6 100%)}
.lock .st{position:absolute;left:0;right:0;top:0;height:54px;display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:6px 30px 0;font:600 15px var(--ui)}
.lock .st .batt{background:#fff;color:#000}
.lock .clock{position:absolute;left:0;right:0;top:110px;text-align:center;font:200 84px/1 var(--display);letter-spacing:-.01em}
.lock .day{position:absolute;left:0;right:0;top:204px;text-align:center;font:400 20px var(--ui)}
.notif{position:absolute;left:10px;right:10px;top:300px;border-radius:16px;background:rgba(245,245,247,.86);color:#111;padding:12px 14px;opacity:0;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.notif .hd{display:flex;align-items:center;gap:8px;font:400 13px var(--ui);color:#555}
.notif .hd img{width:22px;height:22px;border-radius:5px;background:#fff;object-fit:contain}
.notif .hd span:last-child{margin-left:auto}
.notif .tx{font:400 15px/1.35 var(--ui);margin-top:6px}
/* набор номера */
.dial{position:absolute;inset:0;background:#fff;z-index:44;transform:translateY(100%)}
.dial .dn{height:52px;display:flex;align-items:center;padding:0 14px;color:var(--accent);position:relative}.dial .dn svg{width:24px;height:24px}
.dial .dt2{position:absolute;left:0;right:0;text-align:center;font:600 18px var(--ui);color:var(--ink)}
.dial .acts{padding:6px 24px;display:flex;flex-direction:column;gap:16px;font:400 16px var(--ui);color:#1a73e8}
.dial .num{text-align:center;font:400 34px var(--ui);color:#2fa84f;margin-top:140px;letter-spacing:.01em}
.dial .reg{text-align:center;font:400 13px var(--ui);color:var(--grey);margin-top:4px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);row-gap:16px;margin:24px 34px 0;text-align:center}
.keys div{font:300 30px var(--ui);color:var(--ink)}.keys small{display:block;font:400 10px var(--ui);color:var(--grey);letter-spacing:.1em;margin-top:-2px}
.callbtns{display:flex;justify-content:center;margin-top:22px}
.callbtns span{display:flex;align-items:center;gap:6px;height:46px;padding:0 20px;background:#34c759;color:#fff;font:600 14px var(--ui)}
.callbtns span:first-child{border-radius:23px 0 0 23px;border-right:1px solid rgba(255,255,255,.5)}.callbtns span:last-child{border-radius:0 23px 23px 0}
.callbtns svg{width:16px;height:16px}
/* диалоги */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;z-index:45}
.dlg{position:absolute;left:28px;right:28px;background:#fff;border-radius:16px;overflow:hidden;opacity:0;z-index:46;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg .dt{font:600 19px var(--ui);padding:20px 20px 10px;color:var(--ink);border-bottom:1px solid #eee}
.dlg .op{position:relative;font:400 17px var(--ui);padding:14px 20px;color:var(--ink)}
.dlg .cn{text-align:right;font:600 15px var(--ui);color:var(--accent);padding:12px 20px 18px}
/* нажатие */
.tap{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(14,124,134,.28);border:3px solid rgba(255,255,255,.95);box-shadow:0 0 0 2px rgba(14,124,134,.55),0 4px 14px rgba(0,0,0,.25);opacity:0;z-index:95;pointer-events:none}
/* подписи */
.caps{position:absolute;left:1000px;top:0;bottom:0;width:780px}
.scene{position:absolute;left:0;top:300px;font:600 20px var(--cap-head);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);opacity:0}
.cap{position:absolute;left:0;top:350px;width:780px;font:600 40px/1.25 var(--cap-head);color:#14282b;opacity:0;text-wrap:balance}
.cap small{display:block;margin-top:22px;font:400 28px/1.4 var(--cap-text);color:#4b6164}
.prog{position:absolute;left:0;bottom:120px;height:4px;width:520px;background:rgba(14,124,134,.15);border-radius:2px;overflow:hidden;opacity:0}
.prog i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}

.page{max-width:1600px;margin:0 auto;padding-inline:16px;padding-block:24px 40px;display:flex;flex-direction:column;gap:16px}
.page header{padding-left:var(--ph,0px)}
#dm-root .page{gap:56px}
#caps .segs{top:51px!important}
#caps .secn{top:91px!important}
#caps .sect{top:139px!important}
#caps .secsub{top:201px!important}
#caps .cap{top:301px!important}

.page h1{font:600 clamp(22px,2.6vw,34px)/1.15 var(--cap-head);margin:0;color:#14282b}
.page .lead{margin:6px 0 0;font:400 15px var(--cap-text);color:#4b6164}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.nw{display:none}
.grid{padding-right:var(--ph,0px)}
@media (max-width:980px){.grid{grid-template-columns:1fr;padding-right:0}.list{height:auto;margin:0;--k:.55}.w{display:none}.nw{display:inline}}
.view{position:relative;width:100%;max-width:100%;aspect-ratio:16/9}
.view .stage{position:absolute;left:0;top:0;right:auto;bottom:auto;width:1920px;height:1080px;transform-origin:0 0;background:transparent}
#caps .sect{font-size:40px!important;color:var(--accent)!important;white-space:nowrap}
#caps .cap{font-size:56px!important;line-height:1.15!important}
#caps .cap small{font-size:28px!important;margin-top:20px!important}
.col{min-width:0;display:flex;flex-direction:column;gap:14px}
.tlw{display:flex;align-items:center;gap:16px;padding-left:var(--ph,0px)}
.tl{position:relative;flex:1;height:28px;cursor:pointer;touch-action:none}
.tl:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.tl .tr{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:#d6e4e5}
.tl .fl{position:absolute;left:0;top:12px;height:4px;border-radius:2px;background:var(--accent);width:0}
.tl .mk i{position:absolute;top:8px;width:2px;height:12px;margin-left:-1px;background:#9fb7b9}
.tl .kb{position:absolute;top:6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #fff,0 1px 4px rgba(0,0,0,.25);left:0}
.tip{position:absolute;bottom:34px;transform:translateX(-50%);background:#14282b;color:#fff;border-radius:8px;padding:8px 12px;font:400 13px/1.35 var(--cap-text);white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transition:opacity .12s}
.tip b{font-weight:600}.tip span{display:block;color:#b9d3d5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl:hover .tip{opacity:1}
.tlt{font:500 14px var(--cap-text);color:#5d7275;font-variant-numeric:tabular-nums;white-space:nowrap}
.callout{position:absolute;z-index:96;opacity:0;pointer-events:none;white-space:nowrap;background:#14282b;color:#fff;font:600 17px 'Inter',Arial,sans-serif;padding:9px 14px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.callout:after{content:"";position:absolute;bottom:-7px;width:14px;height:14px;background:#14282b;transform:rotate(45deg)}

 tap(t+24000,[28,54+28]);pop($('pbook'),$('dCard'),t+24200);
 cap(t+24400,t+29000,'Чат с дилером — прямо из карточки<small>Оперативная поддержка сотрудника автоцентра</small>');
 scrollY(art,t+24500,800,yL,0);
 tapEl(t+25800,'dcChat');push($('dCard'),$('dChat'),t+26050);fadeOut('fab',t+26050,200);
 tap(t+28400,[28,54+28]);pop($('dChat'),$('dCard'),t+28600);fadeIn('fab',t+28800,200);
 cap(t+29000,t+31000,'Назад — к списку автоцентров');
 tap(t+29600,[28,54+28]);pop($('dCard'),$('home'),t+29800);
 return t+31000;}

build=function(){
 let t=0,s;
 const run=(i,fn)=>{s=t;t=fn(t);section(i,s,t+GAP/2);t+=GAP;};
 run(0,sceneNewsInfo);
 run(1,scenePushB);
 run(2,sceneShowcase);
 run(3,sceneHistoryB);

/* Живое воспроизведение сцены на странице: пуск/пауза, полоса времени, переход к разделу,
   автозапуск при появлении на экране, масштаб по ширине и выравнивание полей по телефону */
(function(){
 const page=document.querySelector('#dm-root .page'),view=document.getElementById('view'),stage=view.querySelector('.stage'),list=document.getElementById('list');
 const PHONE_LEFT=293.65;            /* левый край телефона (с рамкой) в координатах сцены 1920×1080 */
 const LIST_W=300,GAP=20;
 const fit=()=>{
  const W=page.clientWidth-32;      /* ширина без полей страницы по 16 */
  const wide=window.matchMedia('(min-width:981px)').matches;
  const w=wide?(W-LIST_W-GAP)/(1+PHONE_LEFT/1920):W;
  page.style.setProperty('--ph',(PHONE_LEFT*w/1920).toFixed(1)+'px');page.style.setProperty('--k',(w/1920).toFixed(4));
  stage.style.transform=`scale(${view.clientWidth/1920})`;};
 new ResizeObserver(fit).observe(page);new ResizeObserver(fit).observe(view);fit();
 const IC={play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>',
  again:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>'};
 function start(){
  const caps=document.getElementById('caps');
  caps.insertAdjacentHTML('beforeend','<button class="playb" id="playb" type="button"><i></i><span></span></button>');
  const btn=document.getElementById('playb');
  const anims=document.getElementById('dm-root').getAnimations({subtree:true}),TOTAL=window.TOTAL,CH=window.CHAPTERS||[];
  const tl=document.getElementById('tl'),fillEl=document.getElementById('tlFill'),knob=document.getElementById('tlKnob'),tTime=document.getElementById('tlTime');
  let t=1000,playing=false,last=0,raf=0,state='',touched=false;
  const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
  list.innerHTML=CH.map(c=>`<li><button type="button" data-t="${c.start}"><span class="n">${String(c.n).padStart(2,'0')}</span><span>${c.title}</span><span class="t">${fmt(c.start)}</span></button></li>`).join('');
  document.getElementById('tlMarks').innerHTML=CH.slice(1).map(c=>`<i style="left:${(c.start/TOTAL*100).toFixed(3)}%"></i>`).join('');
  const items=[...list.querySelectorAll('button')];
  let lastK=-1;
  const draw=()=>{anims.forEach(a=>{a.currentTime=t;});
   let k=0;CH.forEach((c,i)=>{if(t>=c.start)k=i;});
   if(k!==lastK){items.forEach((b,i)=>b.classList.toggle('on',i===k));lastK=k;}
   const p=(t/TOTAL*100).toFixed(3)+'%';fillEl.style.width=p;knob.style.left=p;tTime.textContent=fmt(t)+' / '+fmt(TOTAL);};
  const ui=()=>{const s=playing?'pause':(t>=TOTAL?'again':'play');if(s===state)return;state=s;
   btn.firstChild.innerHTML=IC[s];btn.lastChild.textContent={pause:'Пауза',again:'Смотреть снова',play:'Смотреть'}[s];btn.setAttribute('aria-label',btn.lastChild.textContent);};
  const tick=now=>{if(!playing)return;t+=Math.min(now-last,100);last=now;
   if(t>=TOTAL){t=TOTAL;playing=false;}draw();ui();if(playing)raf=requestAnimationFrame(tick);};
  const play=()=>{touched=true;if(t>=TOTAL)t=0;playing=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);ui();};
  const pause=()=>{touched=true;playing=false;cancelAnimationFrame(raf);ui();};
  btn.addEventListener('click',()=>playing?pause():play());
  list.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;t=+b.dataset.t;draw();play();});
  /* полоса времени: нажатие или перетаскивание */
  let drag=false,wasPlaying=false;
  const seek=e=>{const r=tl.getBoundingClientRect();t=Math.max(0,Math.min(TOTAL,(e.clientX-r.left)/r.width*TOTAL));draw();ui();};
  tl.addEventListener('pointerdown',e=>{drag=true;wasPlaying=playing;if(playing){playing=false;cancelAnimationFrame(raf);}touched=true;tl.setPointerCapture(e.pointerId);seek(e);});
  tl.addEventListener('pointermove',e=>{if(drag)seek(e);});
  const up=()=>{if(!drag)return;drag=false;if(wasPlaying&&t<TOTAL)play();else ui();};
  const tip=document.getElementById('tlTip'),CAPS=window.CAPS||[];
  const tipAt=e=>{const r=tl.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left)),m=x/r.width*TOTAL;
   let sec=CH[0];CH.forEach(c=>{if(m>=c.start)sec=c;});const cp=CAPS.find(c=>m>=c.t0&&m<c.t1);
   tip.innerHTML=`<b>${fmt(m)}</b> · ${String(sec.n).padStart(2,'0')}. ${sec.title}`+(cp?`<span>${cp.h}</span>`:'');
   tip.style.left=Math.max(110,Math.min(r.width-110,x))+'px';};
  tl.addEventListener('pointermove',tipAt);tl.addEventListener('pointerenter',tipAt);
  tl.addEventListener('pointerup',up);tl.addEventListener('pointercancel',up);
  tl.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){t=Math.max(0,Math.min(TOTAL,t+(e.key==='ArrowRight'?5000:-5000)));draw();ui();e.preventDefault();}});
  draw();ui();
  /* автозапуск, когда демонстрация появилась на экране */
  const io=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)){io.disconnect();if(!touched)play();}},{threshold:.4});
  io.observe(view);
 }
 const wait=()=>window.READY?start():setTimeout(wait,50);wait();
})();
</script>
